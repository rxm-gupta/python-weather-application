apiVersion: v1
kind: Service
metadata:
  name: weather-app-service
spec:
  type: NodePort
  selector:
    app: weather-app
  ports:
    - protocol: TCP
      port: 80                 # Port exposed inside the cluster
      targetPort: 5000         # Port Flask app listens to inside container
      nodePort: 30038          # We can choose any port between 30000-32767  # Port to access from outside (Minikube IP)
